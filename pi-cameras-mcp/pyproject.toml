[project]
name = "pi-cameras-mcp"
version = "0.1.0"
description = "MCP server for Raspberry Pi snapshots and low-latency streams from a C920 and a Pi camera"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pi-cameras-mcp = "pi_cameras_mcp.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
